name: Verify Rowdy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rowdy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-client:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit and integration tests
        run: |
          mkdir -p verification
          python -m unittest discover -s tests -v 2>&1 | tee verification/python.txt
      - name: Build installable package
        run: |
          python -m pip install 'setuptools>=68' wheel
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          python -m venv /tmp/rowdy-installed
          /tmp/rowdy-installed/bin/pip install --no-deps dist/*.whl
          python scripts/verify_install.py --command /tmp/rowdy-installed/bin/rowdy --out verification/installed.json
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Direct browser workflows (no renderer bridge allowed)
        run: python scripts/verify_browser.py --require-direct
      - name: Record actual direct-browser walkthrough
        run: python scripts/record_walkthrough.py --require-direct
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rowdy-reference-verification
          path: |
            verification/
            dist/
          retention-days: 14
