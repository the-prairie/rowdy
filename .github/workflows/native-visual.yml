name: Native GPUI runtime evidence
on:
  pull_request:
    paths: ['native/**', 'rowdy/**', 'scripts/verify_native_visual.py', '.github/workflows/native-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rowdy-native-visual-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  native-visual:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: arezki1990/dbt-zed
          ref: 3ee08f10debe9464b53b3e1241b56b6deb4e79fb
          path: upstream
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: |
            upstream/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rowdy-metal-macos15-3ee08f1-1.97.1-v1-${{ github.sha }}
          restore-keys: rowdy-metal-macos15-3ee08f1-1.97.1-v1-
      - name: Prepare exact native source and test instrumentation
        run: |
          mkdir -p verification/native-visual
          git rev-parse HEAD > verification/native-visual/rowdy-sha.txt
          git -C upstream rev-parse HEAD > verification/native-visual/upstream-sha.txt
          xcodebuild -version > verification/native-visual/xcode.txt
          python -m pip install 'setuptools>=68' wheel
          python -m pip install --no-deps --no-build-isolation -e .
          python native/apply.py upstream --check
          python native/apply.py upstream
          python native/apply.py upstream --check
          python native/visual_apply.py upstream
          git -C upstream diff --stat > verification/native-visual/instrumentation.txt
      - name: Build actual native visual test executable
        id: build
        run: |
          command -v cmake || brew install cmake
          cd upstream
          rustup show > ../verification/native-visual/toolchain.txt
          cargo build --locked -p zed --bin zed_visual_test_runner --features visual-tests,gpui_platform/runtime_shaders 2>&1 | tee ../verification/native-visual/build.txt
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.build.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          path: |
            upstream/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rowdy-metal-macos15-3ee08f1-1.97.1-v1-${{ github.sha }}
      - name: Exercise native pointer callbacks and live buffer changes
        run: python scripts/verify_native_visual.py --binary upstream/target/debug/zed_visual_test_runner --out verification/native-visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-runtime-evidence
          path: verification/native-visual/
          retention-days: 14
          if-no-files-found: error
# Direct Metal captures; no OS privacy changes or cloud access. Compile cache
# contains only public source/dependencies, never credentials or Rowdy state.
