name: macOS local service acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Diagnose an isolated synthetic worker
        run: |
          mkdir -p verification/mac-service
          python - <<'PY' > verification/mac-service/worker-probe.txt 2>&1
          import json, subprocess, sys, resource, platform
          from rowdy.engine import _worker
          request={'snapshot':{'tables':{}},'sql':'SELECT 1 AS value','limit':10}
          for request_kind, payload in [('bare',request),('repeat',request)]:
              p=subprocess.run([sys.executable,'-m','rowdy.worker'],input=json.dumps(payload),text=True,capture_output=True,timeout=10)
              print(json.dumps({'kind':request_kind,'platform':platform.platform(),'python':sys.version,'returncode':p.returncode,'stdout':p.stdout,'stderr':p.stderr,'maxrss':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss}))
          print('parent:',_worker(request))
          PY
      - name: Exercise source suite on the intended operating system
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee verification/mac-service/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-service-evidence
          path: verification/mac-service/
          retention-days: 14
